x-service-env: &service-env
  EUREKA_URL: http://eureka-server:8761/eureka
  JWT_SECRET: ${JWT_SECRET:-sf-hotels-development-secret-key-change-me-0123456789}

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 20s

services:
  eureka-server:
    build:
      context: .
      args:
        MODULE: eureka-server
    image: sf-hotels/eureka-server:1.0.0
    ports:
      - "8761:8761"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fs http://localhost:8761/actuator/health || exit 1"]

  hotel-service:
    build:
      context: .
      args:
        MODULE: hotel-service
    image: sf-hotels/hotel-service:1.0.0
    environment: *service-env
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]

  booking-service:
    build:
      context: .
      args:
        MODULE: booking-service
    image: sf-hotels/booking-service:1.0.0
    environment: *service-env
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    image: sf-hotels/api-gateway:1.0.0
    environment: *service-env
    ports:
      - "8080:8080"
    depends_on:
      booking-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
