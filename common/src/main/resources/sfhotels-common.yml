app:
  security:
    jwt-secret: ${JWT_SECRET:sf-hotels-development-secret-key-change-me-0123456789}
    token-ttl: PT1H

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0

spring:
  mvc:
    format:
      date: iso
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  file:
    name: logs/${spring.application.name}.json
  structured:
    format:
      file: ecs
